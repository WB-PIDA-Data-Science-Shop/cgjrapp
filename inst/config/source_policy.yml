# CGJR research source policy: which external publications the AI Report may
# cite, and how much research it may do per report section.
#
# Read and checked by load_source_policy() (R/source_policy.R). The journal
# identifiers come from OpenAlex via data-raw/source_policy_journals.R - re-run
# that script rather than typing ISSNs or ids by hand. A journal is matched by
# ISSN or OpenAlex id, never by its name.

tiers:
  - tier: 1
    name: World Bank Group publications
    use: Preferred for country diagnostics, institutional analysis and applied policy evidence.
  - tier: 2
    name: Other international organizations
    use: Eligible for consideration; the institution's standing is not acceptance of every claim.
  - tier: 3
    name: Peer-reviewed journals
    use: Articles in a journal listed below.
  - tier: 4
    name: Official national sources
    use: Statements of policy or law; not by themselves evidence that a policy was implemented or worked.
  - tier: 5
    name: Other credible research
    use: Working papers from the series listed below, always labelled as not peer reviewed.

# Publishers of reports and working papers in tiers 1 and 2. `domains` are the
# official web domains (subdomains included) their documents are served from.
institutions:
  - code: WBG
    name: World Bank Group
    tier: 1
    domains: [worldbank.org, worldbankgroup.org, ifc.org, miga.org]
  - code: IMF
    name: International Monetary Fund
    tier: 2
    domains: [imf.org]
  - code: OECD
    name: Organisation for Economic Co-operation and Development
    tier: 2
    domains: [oecd.org, oecd-ilibrary.org]
  - code: ILO
    name: International Labour Organization
    tier: 2
    domains: [ilo.org]
  - code: UNDP
    name: United Nations Development Programme
    tier: 2
    domains: [undp.org]
  - code: UNCTAD
    name: United Nations Conference on Trade and Development
    tier: 2
    domains: [unctad.org]
  - code: UNDESA
    name: United Nations Department of Economic and Social Affairs
    tier: 2
    domains: [un.org]
  - code: AfDB
    name: African Development Bank
    tier: 2
    domains: [afdb.org]
  - code: ADB
    name: Asian Development Bank
    tier: 2
    domains: [adb.org]
  - code: IDB
    name: Inter-American Development Bank
    tier: 2
    domains: [iadb.org]
  - code: EBRD
    name: European Bank for Reconstruction and Development
    tier: 2
    domains: [ebrd.com]

# Working-paper series accepted in tier 5.
series:
  - id: nber_wp
    name: NBER Working Paper
    publisher: National Bureau of Economic Research
    domains: [nber.org]
  - id: cepr_dp
