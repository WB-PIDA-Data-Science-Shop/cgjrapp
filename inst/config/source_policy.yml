# How to search. Queries are built only from these terms, the section's
# taxonomy label, the country name and the dashboard's indicator names -
# never from the guidance note. `terms` are keyed by report section (leaf);
# a section without terms is searched by its label alone.
search:
  # World Bank Documents & Reports major document types worth reading
  # (project paperwork - procurement plans, safeguards - is left out)
  wb_document_groups: ["Publications & Research", "Economic & Sector Work", "Country Focus"]
  languages: [English]
  # mAI web search is limited to these sites: document repositories whose
  # links resolve to records (whole institution domains mostly return news
  # and project pages)
  mai_sites: [documents.worldbank.org, openknowledge.worldbank.org]
  terms:
    degree_of_integrity: [corruption, anti-corruption]
    transparency_and_accountability: [transparency, accountability, access to information]
    justice_and_rule_of_law: [judiciary, rule of law, contract enforcement]
    budget_cycle_and_fiscal_planning: [public financial management, budget, fiscal planning]
    domestic_revenue_mobilization: [tax administration, revenue mobilization]
    public_procurement: [public procurement]
    public_investment_management: [public investment management]
    public_sector_hrm: [civil service, public employment]
    digital_and_data: [digital government, e-government]
    market_regulatory_institutions: [regulation, competition policy, business environment]
    service_delivery: [public service delivery]
    soe_governance: [state-owned enterprises]
    political_institutions_and_social_cohesion: [political institutions, checks and balances]
    social_cohesion_norms_and_cooperation: [social cohesion, trust]

# Research effort per report section, and network bounds.
limits:
  max_candidates_per_leaf: 10
  # sources selected per section: institutional publications (tiers 1, 2,
  # 4, 5) and peer-reviewed articles (tier 3) each have their own places
  max_institutional_per_leaf: 6
  max_peer_reviewed_per_leaf: 4
  # passages of each selected source passed on (the most relevant first)
  passages_per_source: 5
  # findings stated per selected source, and per report section
  max_findings_per_source: 3
  max_findings_per_leaf: 20
  request_timeout_s: 20
  max_redirects: 5
  max_pdf_mb: 50
  # research results (searches, DOI records) are reused for this long
  cache_days: 30
  # relevance screening: at most this many candidates per section in one
  # LLM call, and publications this recent rank first among equals
  max_screened_per_leaf: 30
  prefer_recent_years: 15
